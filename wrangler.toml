name = "yfbjj-funnel"
main = "src/worker.js"
compatibility_date = "2026-05-01"
account_id = "cb8ab13b857925cdb9b3c0fd9d4ec4bf"

# Custom domain for the funnel. Requires the yogaforbjj.net zone on this Cloudflare
# account; wrangler creates the DNS record + cert on first deploy.
routes = [
  { pattern = "welcome.yogaforbjj.net", custom_domain = true }
]

# Serve .html files as text modules -> plain HTML files, no build step.
# Images are served by Cloudflare's asset server, not bundled into the Worker.
# The directory holds ONLY generated derivatives... originals stay in
# src/images/_src/, outside this path, so they are never uploaded.
[assets]
directory = "./public"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/_page.js", "**/_admin.js", "**/_admin-login.js"]
fallthrough = true

# Burst limiter: in-memory at the edge, no D1 write, no extra resource.
# `period` only accepts 10 or 60 seconds, so the 30/hour window lives in D1.
[[ratelimits]]
name = "LEAD_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "yfbjj_funnel"
database_id = "0cce4280-1113-45f5-b0da-bd5979f7cace"
migrations_dir = "migrations"

[vars]
BUNDLE_PRICE_CENTS = "1400"
# PREVIEW_MODE gates the cart handoff. TRUE (or unset, or anything but the exact
# string "false") sends every CTA to /preview-checkout and locks Stripe Checkout.
# Turn it off only after every production gate passes. `npm run preflight` enforces this.
PREVIEW_MODE = "false"
# Visual staging has no D1 binding. In this mode every stateful endpoint stops
# before it reads or writes, while the reviewable pages continue to render.
PREVIEW_NO_D1 = "false"

# ISO 8601, e.g. "2026-09-01T23:59:00Z". Empty = deadline block hidden entirely.
OFFER_DEADLINE = ""

# Stripe identifiers are non-secret. Secret keys and the future webhook
# signing secret are Cloudflare Secrets and must never appear in this file.
STRIPE_PRICE_BUNDLE = "price_1U9IkNIwpEtt4FIedvXFb9tC"
STRIPE_PRICE_HEAD_TO_TOES = "price_1U9IkOIwpEtt4FIeqq3edSnR"
STRIPE_PRICE_HEAD_TO_TOES_BUMP = "price_1UCAxLIwpEtt4FIegBY4qx4c"
HEAD_TO_TOES_BUMP_PRICE_CENTS = "900"
STRIPE_PRICE_LIFETIME = "price_1U9IkPIwpEtt4FIeD0mbQvCK"
STRIPE_PRICE_TWO_MONTH = "price_1UB58oIwpEtt4FIe6C6UqWKy"
STRIPE_PRODUCT_TWO_MONTH = "prod_V9byHoYGBGpDpc"
STRIPE_PRICE_CERTIFICATION = "price_1UAvcCIwpEtt4FIeaPk7pUzB"
# Confirmed read-only references plus the exact runtime grant keys. UUIDs are
# not assumed to be bundle slugs. Checkout fails closed while a required slug or
# plan target is missing.
AUTOCREATOR_GUARD_RETENTION_BUNDLE_UUID = "f0b327de-4093-4873-9f47-3113ad50ead0"
AUTOCREATOR_HEAD_TO_TOES_BUNDLE_UUID = "3c3947f7-cb93-4d40-a8c9-1806b6ed7060"
AUTOCREATOR_GUARD_RETENTION_BUNDLE_SLUG = "14-guard-retention-bundle"
AUTOCREATOR_HEAD_TO_TOES_BUNDLE_SLUG = "yoga-for-rocks-head-to-toes"
AUTOCREATOR_LIFETIME_PLAN_PRICE_REFERENCE = "price_1TdIGeARWKYPSBdfrFBG6rhT"
AUTOCREATOR_MONTHLY_PLAN_PRICE_REFERENCE = "price_1TdIGdARWKYPSBdfNJFlXdwy"
AUTOCREATOR_LIFETIME_ENTITLEMENT_TARGET = "price_1TdIGeARWKYPSBdfrFBG6rhT"
AUTOCREATOR_MONTHLY_ENTITLEMENT_TARGET = "price_1TdIGdARWKYPSBdfNJFlXdwy"
# Certification is one $297 Stripe offer that grants all three existing levels.
AUTOCREATOR_CERTIFICATION_LEVEL_1_BUNDLE_SLUG = "level-1-instructors-course"
AUTOCREATOR_CERTIFICATION_LEVEL_2_BUNDLE_SLUG = "level-2-instructor-course"
AUTOCREATOR_CERTIFICATION_LEVEL_3_BUNDLE_SLUG = "level-3-instructors-course"
AUTOCREATOR_API_BASE = "https://yfbjj.autocreator.ai/api/v1"
AUTOCREATOR_TIMEOUT_MS = "8000"
# Set only after the endpoint signature test and authenticated AutoCreator
# grant/retry/lifecycle test pass against the exact deployed revision.
STRIPE_WEBHOOK_READY = "true"
AUTOCREATOR_FULFILLMENT_READY = "true"

[env.staging]
name = "yfbjj-funnel-stripe-staging"
workers_dev = true
routes = []

[[env.staging.ratelimits]]
name = "LEAD_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "yfbjj_funnel_staging"
database_id = "e2ebcc63-f373-451e-84a9-9118f8053f82"
migrations_dir = "migrations"

