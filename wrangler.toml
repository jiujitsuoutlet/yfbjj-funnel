name = "yfbjj-funnel"
main = "src/worker.js"
compatibility_date = "2026-05-01"
account_id = "cb8ab13b857925cdb9b3c0fd9d4ec4bf"

# Custom domain for the funnel. Requires the yogaforbjj.net zone on this Cloudflare
# account; wrangler creates the DNS record + cert on first deploy.
routes = [
  { pattern = "welcome.yogaforbjj.net", custom_domain = true }
]

# Serve .html files as text modules -> plain HTML files, no build step.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/_page.js"]
fallthrough = true

# Burst limiter: in-memory at the edge, no D1 write, no extra resource.
# `period` only accepts 10 or 60 seconds, so the 30/hour window lives in D1.
[[ratelimits]]
name = "LEAD_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "yfbjj_funnel"
# Filled in by `wrangler d1 create yfbjj_funnel`. Placeholder is intentionally
# invalid so a deploy against an unconfigured DB fails loudly instead of silently.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
BUNDLE_PRICE_CENTS = "1400"
LIFETIME_PRICE_CENTS = "29700"
YEARLY_PRICE_CENTS = "9700"

# PREVIEW_MODE gates the cart handoff. TRUE (or unset, or anything but the exact
# string "false") sends every CTA to /preview-checkout instead of ThriveCart.
# Turn it off only when the cart link below is real. `npm run preflight` enforces this.
PREVIEW_MODE = "true"

# Checkout is ThriveCart, not Stripe. These are the two knobs to turn at launch.
# THRIVECART_*_URL: paste the real cart links. Until then the CTA renders in a
# disabled state instead of a dead link.
THRIVECART_BUNDLE_URL = ""
THRIVECART_LIFETIME_URL = ""
# ISO 8601, e.g. "2026-09-01T23:59:00Z". Empty = deadline block hidden entirely.
OFFER_DEADLINE = ""
